<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-labelledby="t">
  <title id="t">¡Huélum! Hecho con amor desde la UPIICSA, con Claude como copiloto</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2444"/>
      <stop offset="1" stop-color="#040B18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="0.5" stop-color="#F5A623"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif; }
    .big { font-size: 30px; font-weight: 800; letter-spacing: 1px; }
    .small { font-size: 16px; font-weight: 500; fill: #9FB0C8; }
    .heart { animation: beat 1.4s ease-in-out infinite; }
    @keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  </style>
  <path d="M0 40 C 220 0, 420 0, 640 28 S 1060 60, 1280 18 V 150 H 0 Z" fill="url(#bg)"/>
  <path d="M0 40 C 220 0, 420 0, 640 28 S 1060 60, 1280 18" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <g class="sans" text-anchor="middle">
    <text x="640" y="96" class="big" fill="url(#gold)">¡HUÉLUM!</text>
    <text x="640" y="126" class="small">Hecho con <tspan class="heart" fill="#E8896A">♥</tspan> desde la UPIICSA · con Claude como copiloto</text>
  </g>
</svg>
