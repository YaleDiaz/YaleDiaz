<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t">
  <title id="t">Yale Diaz · Ingeniería en Informática · IPN UPIICSA</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2444"/>
      <stop offset="0.55" stop-color="#081830"/>
      <stop offset="1" stop-color="#040B18"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="0.82" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCoral" cx="0.08" cy="1" r="0.5">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="0.5" stop-color="#F5A623"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="340" rx="22"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Ubuntu, Roboto, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'DejaVu Sans Mono', Menlo, monospace; }
    .chip { font-size: 14px; font-weight: 700; letter-spacing: 2.6px; fill: #6FDC9C; }
    .name { font-size: 84px; font-weight: 800; fill: #FFFFFF; letter-spacing: -1.5px; }
    .sub  { font-size: 25px; font-weight: 500; fill: #C9D3E3; }
    .tag  { font-size: 23px; font-weight: 600; fill: #F5A623; }
    .t2, .t3 { opacity: 0; }
    .t1 { animation: cycle 12s linear infinite; }
    .t2 { animation: cycle 12s linear 4s infinite; }
    .t3 { animation: cycle 12s linear 8s infinite; fill: #E8896A; }
    @keyframes cycle { 0% { opacity: 0; } 3%, 30% { opacity: 1; } 33%, 100% { opacity: 0; } }
    .line { stroke-dasharray: 430; animation: draw 1.6s ease-out 0.3s backwards; }
    @keyframes draw { from { stroke-dashoffset: 430; } to { stroke-dashoffset: 0; } }
    .code { font-size: 18px; fill: #C9D3E3; }
    .kw { fill: #E8896A; } .var { fill: #FFFFFF; } .prop { fill: #8FB8FF; } .str { fill: #F5C26B; } .heart { fill: #E8896A; }
    .l1 { animation: fade 0.5s ease-out 0.4s backwards; }
    .l2 { animation: fade 0.5s ease-out 0.7s backwards; }
    .l3 { animation: fade 0.5s ease-out 1.0s backwards; }
    .l4 { animation: fade 0.5s ease-out 1.3s backwards; }
    .l5 { animation: fade 0.5s ease-out 1.6s backwards; }
    .l6 { animation: fade 0.5s ease-out 1.9s backwards; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: 1s; } .s3 { animation-delay: 2s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#dots)"/>
    <rect width="1280" height="340" fill="url(#glowGold)"/>
    <rect width="1280" height="340" fill="url(#glowCoral)"/>
    <rect x="0" y="334" width="1280" height="6" fill="url(#gold)"/>
  </g>

  <!-- estrellas -->
  <circle class="star" cx="640" cy="44" r="2.4" fill="#F5A623"/>
  <circle class="star s2" cx="672" cy="300" r="1.8" fill="#FFD98A"/>
  <circle class="star s3" cx="1240" cy="40" r="2" fill="#E8896A"/>
  <circle class="star s2" cx="40" cy="36" r="1.8" fill="#FFD98A"/>

  <!-- izquierda -->
  <g class="sans">
    <rect x="62" y="48" width="292" height="34" rx="17" fill="#3DBE73" fill-opacity="0.13" stroke="#3DBE73" stroke-opacity="0.65"/>
    <circle cx="84" cy="65" r="5" fill="#6FDC9C"/>
    <text x="100" y="70" class="chip">ORGULLOSAMENTE UPIICSA</text>

    <text x="58" y="168" class="name">Yale <tspan fill="url(#gold)">Diaz</tspan></text>
    <path class="line" d="M64 192 H 470" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>

    <text x="62" y="236" class="sub">Ingeniería en Informática · IPN · Ciudad de México</text>

    <text x="62" y="288" class="tag t1">▸ Construyo software para negocios reales</text>
    <text x="62" y="288" class="tag t2">▸ Creo contenido de tech, fitness y emprendimiento</text>
    <text x="62" y="288" class="tag t3">▸ Aprendo construyendo con Claude ♥</text>
  </g>

  <!-- derecha: ventana de código -->
  <g>
    <rect x="712" y="48" width="512" height="246" rx="14" fill="#0A1628" fill-opacity="0.9" stroke="#F5A623" stroke-opacity="0.35"/>
    <path d="M712 62 a14 14 0 0 1 14 -14 H1210 a14 14 0 0 1 14 14 V86 H712 Z" fill="#FFFFFF" fill-opacity="0.04"/>
    <circle cx="736" cy="67" r="6" fill="#FF5F57"/>
    <circle cx="756" cy="67" r="6" fill="#FEBC2E"/>
    <circle cx="776" cy="67" r="6" fill="#28C840"/>
    <text x="968" y="72" text-anchor="middle" class="mono" font-size="14" fill="#5E7394">yale.js</text>

    <g class="mono code">
      <text x="736" y="122" class="l1"><tspan class="kw">const</tspan> <tspan class="var">yale</tspan> = {</text>
      <text x="758" y="152" class="l2"><tspan class="prop">escuela</tspan>: <tspan class="str">"IPN UPIICSA"</tspan>,</text>
      <text x="758" y="182" class="l3"><tspan class="prop">carrera</tspan>: <tspan class="str">"Ing. Informática"</tspan>,</text>
      <text x="758" y="212" class="l4"><tspan class="prop">copiloto</tspan>: <tspan class="str">"Claude </tspan><tspan class="heart">♥</tspan><tspan class="str">"</tspan>,</text>
      <text x="758" y="242" class="l5"><tspan class="prop">construye</tspan>: [<tspan class="str">"apps"</tspan>, <tspan class="str">"webs"</tspan>, <tspan class="str">"videos"</tspan>],</text>
      <text x="736" y="272" class="l6">};<tspan class="cursor" fill="#F5A623"> ▌</tspan></text>
    </g>
  </g>
</svg>
